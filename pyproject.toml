[project]
name = "spp-lobby"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "mutmut>=3.7",
    "pyright>=1.1",
    "ruff>=0.16",
]

[tool.setuptools.packages.find]
include = ["app*", "features*", "shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app", "features", "shared"]

[tool.mutmut]
source_paths = ["app", "features", "shared"]
pytest_add_cli_args_test_selection = ["tests"]

[tool.pyright]
include = ["app", "features", "shared"]
exclude = ["tests", ".venv", "mutants"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]