[project]
name = "spp-lobby"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "mutmut>=3.7",
    "pyright>=1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]

[tool.mutmut]
source_paths = ["app"]
pytest_add_cli_args_test_selection = ["tests"]

[tool.pyright]
include = ["app"]
exclude = ["tests", ".venv", "mutants"]
pythonVersion = "3.12"
typeCheckingMode = "strict"